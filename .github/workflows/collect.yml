name: Collecte quotidienne des ventes

on:
  schedule:
    # DEUX créneaux, à dessein. L'ordonnanceur de GitHub n'offre aucune
    # garantie : il met les tâches planifiées en file, les retarde de plusieurs
    # dizaines de minutes en période de charge, et peut purement en abandonner.
    # Le script étant idempotent (un snapshot par jour UTC, remplacé et non
    # empilé), un second passage ne coûte rien et rattrape un créneau sauté.
    # Les minutes sont volontairement « quelconques » : celles de la minute 0
    # subissent le pic de charge et sont les plus souvent retardées.
    - cron: "37 6 * * *"   # 08:37 Paris (heure d'été) / 07:37 (hiver)
    - cron: "23 12 * * *"  # 14:23 Paris — filet de rattrapage
  # Relance manuelle depuis l'onglet Actions.
  workflow_dispatch:

# Un seul run à la fois : évite deux commits concurrents sur data/.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Relever les disponibilités
        run: npm run collect

      - name: Committer le snapshot
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/history.json docs/data/latest.json
          if git diff --staged --quiet; then
            echo "Aucun changement de données — commit à vide pour garder le dépôt actif."
            git commit --allow-empty -m "chore(data): relevé du $(date -u +%Y-%m-%d) (inchangé)"
          else
            git commit -m "chore(data): relevé du $(date -u +%Y-%m-%d)"
          fi
          git push
