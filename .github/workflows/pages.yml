name: Publier le dashboard

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  # Indispensable : le commit quotidien de la collecte est poussé avec le
  # GITHUB_TOKEN par défaut, et GitHub NE déclenche PAS d'événement `push`
  # pour ces commits-là. Sans ce `workflow_run`, les données seraient bien
  # committées chaque matin mais le site publié resterait figé.
  workflow_run:
    workflows: ["Collecte quotidienne des ventes"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ne pas annuler un déploiement en cours, mais n'en garder qu'un en attente.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Ne pas republier si la collecte a échoué : mieux vaut des données de la
    # veille qu'un site reconstruit sur un relevé incomplet.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
